# relative-movers 설정

markets: [KOSPI, KOSDAQ]

# 기간 정의 (DESIGN.md 2절): 구간 [from, T]
#  - kind: calendar  → 기준 날짜 = T - days/months/years, from = 기준 날짜 이후 가장 가까운 거래일
#  - kind: trading_days → from = T 에서 (days-1) 거래일 전 (1d 는 from = T)
#  - 기준가 = from 직전 거래일 종가
periods:
  1d: {days: 1, kind: trading_days}
  1w: {days: 7, kind: calendar}
  1m: {months: 1, kind: calendar}
  6m: {months: 6, kind: calendar}
  1y: {years: 1, kind: calendar}

top_n: 20

# 제외 규칙 (ETF, 신규상장은 항상 제외)
exclude:
  etn: true
  spac: true
  preferred: true        # 우선주
  administrative: true   # 관리종목
  suspended: true        # 기간 중 거래량 0

filters:
  min_avg_trading_value: 0   # 원 단위, 0이면 미적용 (예: 100000000 = 1억)

fetch:
  sleep_sec: 1
  max_retries: 3
  import_retry_backoff_sec: 10   # pykrx import(KRX 로그인) 실패 시 재시도 간격(초) × 시도 횟수
  cache_dir: data/cache

output:
  dir: outputs
  formats: [csv, md]
  sqlite_path: data/movers.db      # 로컬 파생물. git 에 넣지 않음 — scripts/rebuild_db.py 로 daily CSV 에서 재구성
  daily_dir: docs/results/daily    # 일별 CSV/MD 사본 (git 커밋 대상, 원본 이력)

notify:
  enabled: true                    # SLACK_WEBHOOK_URL 환경변수가 없으면 경고 후 생략
  channel: slack
  top_k: 5                         # 조합별 상위/하위 종목 수
