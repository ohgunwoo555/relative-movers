name: validate_main

# 5단계 검증: 2시장 × 5기간 전체 → movers.md 를 Summary 에, 일별 csv·md 를 docs/results/daily 에 커밋 (DB 는 커밋하지 않음)
on:
  workflow_dispatch:
    inputs:
      base_date: {description: "실행일 YYYYMMDD (기본 오늘)", default: "", required: false}
      markets: {description: "쉼표 구분 (기본 config)", default: "", required: false}
      periods: {description: "쉼표 구분 (기본 config)", default: "", required: false}

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit tests (offline)
        run: python -m pytest -q
      - name: Run validate_main
        id: run
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p docs/results
          set +e
          python -m src.main \
            --no-db \
            --daily-dir docs/results/daily \
            --result-json docs/results/main_result.json \
            $([ -n "${{ inputs.base_date }}" ] && echo --base-date "${{ inputs.base_date }}") \
            $([ -n "${{ inputs.markets }}" ] && echo --markets "${{ inputs.markets }}") \
            $([ -n "${{ inputs.periods }}" ] && echo --periods "${{ inputs.periods }}") \
            2>&1 | tee docs/results/validate_main.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc
      - name: Summarize
        if: always()
        run: |
          {
            echo "## validate_main (exit ${{ steps.run.outputs.exit_code }})"
            echo
            python scripts/summarize_result.py main || echo "_결과 JSON 없음 — 로그 artifact 참고_"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate_main-${{ github.run_number }}
          path: |
            docs/results/main_result.json
            docs/results/daily/*
            docs/results/validate_main.log
            outputs/**
          if-no-files-found: warn
          retention-days: 30
      - name: Commit results to docs/results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/results/
          git reset -q docs/results/*.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no result changes"
          else
            git commit -m "results: validate_main run ${{ github.run_number }} (exit ${{ steps.run.outputs.exit_code }})"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
