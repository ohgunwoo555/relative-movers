name: validate_stage1

# DESIGN.md 10절 1단계 검증을 GitHub Actions 러너(해외 IP)에서 수동 실행한다.
# - pykrx 5종 함수 동작·소요시간, 액면분할 수정주가 반영 여부
# - KRX 해외 IP 차단 여부(DESIGN.md 9절) 확인을 겸한다
on:
  workflow_dispatch:
    inputs:
      split_ticker:
        description: "액면분할 종목코드 (기본 포스코스틸리온)"
        default: "058430"
        required: false
      split_name:
        description: "종목명 (종목코드 교차확인용)"
        default: "포스코스틸리온"
        required: false
      split_date:
        description: "분할 신주 변경상장일 YYYYMMDD"
        default: "20260423"
        required: false
      market:
        description: "분할 종목 시장 (KOSPI/KOSDAQ)"
        default: "KOSPI"
        required: false
      skip_1y:
        description: "1년치 전종목 등락률 호출 생략"
        type: boolean
        default: false
        required: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run stage-1 validation
        id: run
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p docs
          set +e
          python scripts/validate_stage1.py \
            --split-ticker "${{ inputs.split_ticker }}" \
            --split-name "${{ inputs.split_name }}" \
            --split-date "${{ inputs.split_date }}" \
            --market "${{ inputs.market }}" \
            $([ "${{ inputs.skip_1y }}" = "true" ] && echo --skip-1y) \
            2>&1 | tee docs/stage1_run.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Summarize
        if: always()
        run: |
          {
            echo "## stage-1 validation (exit ${{ steps.run.outputs.exit_code }})"
            echo
            if [ -f docs/stage1_result.json ]; then
              python - <<'PY'
          import json
          r = json.load(open("docs/stage1_result.json", encoding="utf-8"))
          print(f"- T = {r.get('T')} · total {r.get('total_sec')}s · pykrx {r.get('pykrx_version')}")
          sc = r.get("split_check") or {}
          print(f"- split verdict: **{sc.get('verdict')}** ({sc.get('ticker')} {sc.get('name_resolved') or ''})")
          print(f"- 1d definition check: **{r.get('definition_check', {}).get('verdict')}**")
          print()
          print("| call | ok | sec | rows |")
          print("|---|---|---|---|")
          for c in r.get("calls", []):
              print(f"| {c['call']} | {c['ok']} | {c['sec']} | {c['rows']} |")
          PY
            else
              echo "_stage1_result.json 없음 — 로그 artifact 참고_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-validation-${{ github.run_number }}
          path: |
            docs/stage1_result.json
            docs/stage1_run.log
          if-no-files-found: warn
          retention-days: 30
